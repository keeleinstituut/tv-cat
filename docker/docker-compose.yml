version: '3.8'

services:
  app:
    build:
      context: ./..
      dockerfile: docker/Dockerfile
    depends_on:
      - mysql
      - amq
      - redis
      - matecat-filters
      - minio
    ports:
      - 8080:80
      - 8443:443
    environment:
      - LOGIN_
      - MATECAT_CLI_HTTP_HOST=http://localhost:8080
      - MATECAT_COOKIE_DOMAIN=localhost
      - MATECAT_COOKIE_SECURE=false
      - MATECAT_COOKIE_SAMESITE=Lex
      - MATECAT_ENABLE_MULTI_DOMAIN_API=no

      - MATECAT_DB_SERVER=mysql
      - MATECAT_DB_DATABASE=matecat
      - MATECAT_DB_USER=matecat
      - MATECAT_DB_PASS=matecat01

      - MATECAT_REDIS_SERVERS=tcp://redis:6379
      - MATECAT_QUEUE_BROKER_ADDRESS=tcp://amq:61613
      - MATECAT_QUEUE_DQF_ADDRESS=tcp://amq:61613
      - MATECAT_QUEUE_JMX_ADDRESS=http://amq:8161
      - MATECAT_QUEUE_CREDENTIALS=admin:admin
      - MATECAT_SSE_BASE_URL=localhost:8080/sse
      - MATECAT_STORAGE_DIR=/var/www/html/storage
      - MATECAT_SMTP_HOST=localhost
      - MATECAT_SMTP_PORT=25
      - MATECAT_SMTP_SENDER=no-reply@matecat.loc
      - MATECAT_SMTP_HOSTNAME=localhost

      - MATECAT_FILTERS_ADDRESS=http://matecat-filters:8732

      - MATECAT_LXQ_LICENSE=false
      - MATECAT_LXQ_PARTNERID=false

      - MATECAT_FILE_STORAGE_METHOD=s3
      - MATECAT_AWS_REGION=us-east-1
      - MATECAT_AWS_ENDPOINT=http://minio:9000
      - MATECAT_AWS_USE_PATH_STYLE_ENDPOINTS=true
      - MATECAT_AWS_SSL_VERIFY=false
      - MATECAT_AWS_STORAGE_BASE_BUCKET=storage
      - MATECAT_AWS_SECRET_KEY=secret
      - MATECAT_AWS_ACCESS_KEY_ID=access

      - MATECAT_AUTOLOAD_PLUGINS=["review_extended"]

      # - MATECAT_AWS_ACCESS_KEY_ID=xxxxxxx
      # - MATECAT_AWS_SECRET_KEY=xxxxxxxxxxxx
      # - MATECAT_AWS_VERSION=latest
      # - MATECAT_AWS_REGION=us-west-2
      # - MATECAT_AWS_PROFILE=default
      # - MATECAT_AWS_STORAGE_BASE_BUCKET=storage-bucket

      - SSE_QUEUE_HOST=amq
      - SSE_QUEUE_PORT=61613
      - SSE_QUEUE_USER=admin
      - SSE_QUEUE_PASSWORD=admin

      - MATECAT_NECTM_KEYCLOAK_BASE_URL=https://sso.dev.tolkevarav.eki.ee
      - MATECAT_NECTM_KEYCLOAK_REALM=tolkevarav-dev
      - MATECAT_NECTM_KEYCLOAK_CLIENT_ID=tv-cat-service
      - MATECAT_NECTM_KEYCLOAK_CLIENT_SECRET=supersecret
      - MATECAT_NEC_TM_BASE_URL=https://api.dev.tolkevarav.eki.ee/tm/api/v1/

      - MATECAT_EKILEX_API_BASE_URL=https://ekilex.ee/api
      - MATECAT_EKILEX_API_KEY=supersecret

      - MATECAT_MTEE_BASE_URL=https://tv-api.mtee.eki.ee/api

      # Needed for init database with MySQL dump.
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_PORT=3306

      # Defining amount of workers for TM analysis and for getting contributions
      - TM_ANALYSIS_P1_MAX_EXECUTORS=1
      - TM_ANALYSIS_P2_MAX_EXECUTORS=1
      - TM_ANALYSIS_P3_MAX_EXECUTORS=1
      - GET_CONTRIBUTION_MAX_EXECUTORS=1
    volumes:
      - ../lib:/var/www/html/lib
      - ../migrations:/var/www/html/migrations
      - ../support_scripts:/var/www/html/support_scripts
      - ../test:/var/www/html/test
      - ../index.php:/var/www/html/index.php
      - ../public/js/cat_source:/var/www/html/public/js/cat_source

  redis:
    image: redis:latest

  mysql:
    image: mysql:latest
    command: mysqld --sql_mode="NO_ENGINE_SUBSTITUTION" --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_USER=temp
      - MYSQL_PASSWORD=temp
      - MYSQL_DATABASE=temp
    ports:
      - 3306:3306

  matecat-filters:
    build:
      context: ./matecat-filters
    ports:
      - 8732:8732

  amq:
    build: ./amq
    ports:
      - 8161:8161

  minio:
    image: quay.io/minio/minio
    entrypoint: /bin/sh
    command:
      - -c
      - >
        minio server /data --console-address ":9001" & 
        sleep 5 &&
        mc alias set tolkevarav http://localhost:9000 admin password &&
        mc mb --ignore-existing tolkevarav/storage &&
        mc admin user add tolkevarav tv-translation-order secret-key &&
        mc admin policy attach tolkevarav readwrite --user=tv-translation-order;
        sleep infinity;
    ports:
      - 9004:9000
      - 9001:9001
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password

  # amq_new:
  #   image: quay.io/artemiscloud/activemq-artemis-broker:latest
  #   ports:
  #     - 61614:61613
  #     - 8162:8161
  #     # - 8161:8161
  #   environment:
  #     - AMQ_EXTRA_ARGS=--nio --host=0.0.0.0 --http-host=0.0.0.0 --relax-jolokia
  #     - AMQ_USER=admin
  #     - AMQ_PASSWORD=admin
volumes:
  app_storage: {}
