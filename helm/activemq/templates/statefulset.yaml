{{- $pvcName := printf "%s-pvc" (include "tv-cat-activemq-service.name" .) -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "tv-cat-activemq-service.fullname" . }}
  labels:
    {{- include "tv-cat-activemq-service.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "tv-cat-activemq-service.fullname" . }}
  selector:
    matchLabels:
      {{- include "tv-cat-activemq-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "tv-cat-activemq-service.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "tv-cat-activemq-service.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.brokerPort}}
            - containerPort: {{ .Values.jmxPort}}
          livenessProbe:
            exec:
              command:
                - "/bin/sh"
                - "-c"
                - test 'Good' = "$(curl -f -u $ACTIVEMQ_USERNAME:$ACTIVEMQ_PASSWORD -s '{{ .Values.healthEndpoint }}' | jq -r .value)"
          readinessProbe:
            exec:
              command:
                - "/bin/sh"
                - "-c"
                - test 'Good' = "$(curl -f -u $ACTIVEMQ_USERNAME:$ACTIVEMQ_PASSWORD -s '{{ .Values.healthEndpoint }}' | jq -r .value)"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.extraEnvVars }}
          env:
            {{- include "common.tplvalues.render" (dict "value" .Values.extraEnvVars "context" $) | nindent 12 }}
          {{- end }}
          envFrom:
            {{- if .Values.extraEnvVarsCM }}
            - configMapRef:
                name: {{ include "common.tplvalues.render" (dict "value" .Values.extraEnvVarsCM "context" $) }}
            {{- end }}
            {{- if .Values.extraEnvVarsSecret }}
            - secretRef:
                name: {{ include "common.tplvalues.render" (dict "value" .Values.extraEnvVarsSecret "context" $) }}
            {{- end }}
          volumeMounts:
          - name: {{ $pvcName }}
            mountPath: {{ .Values.mountPath }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: {{ $pvcName }}
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: {{ .Values.storageClassName }}
        resources:
          requests:
            storage: 5Gi