apiVersion: v1
kind: Service
metadata:
  name: {{ include "tv-cat-filters-service.fullname" . }}
  labels:
    {{- include "tv-cat-filters-service.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: filters
      port: {{ .Values.port }}
  selector:
    {{- include "tv-cat-filters-service.selectorLabels" . | nindent 4 }}
